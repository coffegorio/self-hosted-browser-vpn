name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Test Go proxy with race detector
        run: go test -race ./...
        working-directory: server

      - name: Vet Go proxy
        run: go vet ./...
        working-directory: server

      - name: Cross-compile Go proxy
        working-directory: server
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            GOOS="${target%/*}" GOARCH="${target#*/}" CGO_ENABLED=0 go build -o "$RUNNER_TEMP/shbvpn-${target%/*}-${target#*/}" .
          done

      - name: Test Chrome extension
        run: npm test
        working-directory: extension

      - name: Test PAC routing
        run: node tests/extension_routing.mjs

      - name: Check installer shell syntax
        run: |
          for script in installer/*.sh; do
            bash -n "$script" || exit
          done

      - name: Compile Python sources
        run: python3 -m py_compile installer/*.py deploy/*.py tests/*.py

      - name: Test Python installers and container startup
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Validate portable Compose configuration
        run: docker compose --env-file deploy/settings.env.example -f deploy/compose.yaml config --quiet

      - name: Build portable server and certificate images
        run: docker compose --env-file deploy/settings.env.example -f deploy/compose.yaml build

      - name: Check built image entrypoints
        run: |
          docker run --rm --entrypoint /app/shbvpn-proxy shbvpn-proxy:local --help
          docker run --rm shbvpn-cert-manager:local --help
